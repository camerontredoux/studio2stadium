name: Deploy

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/openapi/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    paths:
      - 'apps/backend/**'
      - 'packages/openapi/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
