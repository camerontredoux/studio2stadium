# fly.toml app configuration file generated for studio2stadium-dev on 2026-02-06T21:28:29-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'studio2stadium-dev'
primary_region = 'iad'

[build]

# Apply pending Drizzle migrations before each release goes live.
# Runs bin/migrate.js (drizzle-orm migrator) in a one-off VM with secrets;
# a non-zero exit aborts the deploy so code never ships ahead of its schema.
[deploy]
  release_command = "node bin/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 4
  cpu_kind = 'shared'

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
